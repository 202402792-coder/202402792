<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메뉴 추천 웹앱 - 브라우저 저장 검증 안내</title><style>body{font-family:system-ui,-apple-system,sans-serif;line-height:1.7;max-width:760px;margin:8vh auto;padding:0 20px;color:#222}button,a{padding:12px 18px;border:1px solid #ddd;border-radius:10px;background:#f5f5f5;cursor:pointer;color:#222}button{margin:5px 5px 5px 0}#result{padding:15px;background:#f5f8f5;border-radius:10px}small{color:#666}</style></head><body><h1>브라우저 저장 기능 점검</h1><p>이 페이지는 앱의 기능이 아니라 검증 보조 도구입니다. 먼저 아래 테스트를 진행한 뒤 <a href="./index.html">웹앱</a>에서도 메뉴 저장 후 새로고침을 직접 확인하세요.</p><p><button id="write">① 테스트 값 저장</button><button id="reload">② 페이지 새로고침</button><button id="clear">③ 테스트 값 삭제</button></p><p id="result" role="status"></p><small>브라우저에 저장된 테스트 값만 사용하며, 앱에서 저장한 메뉴는 변경하지 않습니다.</small><script>const k='today-menu-storage-verification';const out=document.getElementById('result');function update(){try{const v=localStorage.getItem(k);out.textContent=v?'저장된 값: '+v+' (새로고침 후에도 같은 값이면 저장 유지 확인)':'테스트 값이 없습니다.'}catch(e){out.textContent='저장소 접근 오류: '+e.message}}document.getElementById('write').onclick=()=>{try{localStorage.setItem(k,'2026-11-18 저장 확인');update()}catch(e){out.textContent='저장 실패: '+e.message}};document.getElementById('reload').onclick=()=>location.reload();document.getElementById('clear').onclick=()=>{try{localStorage.removeItem(k);update()}catch(e){out.textContent='삭제 실패: '+e.message}};update()</script></body></html>
